name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A new push does not kill the run that is already going. Twice now a push
  # has cancelled a build at the lint stage, which is the one stage that had
  # not yet reported. Two runs finishing is worth more than one saved minute.
  cancel-in-progress: false

env:
  # Never wait on a console prompt. A build that asks a question on a runner
  # is a build that hangs until the job times out.
  GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false
  TERM: dumb

jobs:
  build:
    name: Build, test and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Show what the runner already has
        timeout-minutes: 5
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools" || true

      # Install the SDK pieces here rather than letting Gradle fetch them in
      # the middle of a build, so a slow package download names itself instead
      # of looking like a slow compile. This step can never fail the job: if
      # sdkmanager is missing or refuses, Gradle downloads what it needs.
      - name: Install the Android SDK packages
        timeout-minutes: 15
        run: |
          set -x
          SDKROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDKROOT" ]; then
            SDKMANAGER="$(find "$SDKROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager on this runner. Gradle will fetch the SDK itself."
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;36.0.0" < /dev/null \
            || echo "sdkmanager could not install those packages. Gradle will try instead."

      - name: Make the wrapper runnable
        run: chmod +x ./gradlew

      # One Gradle run, not three. Each extra run pays for a fresh JVM and a
      # fresh configuration pass. Reading from /dev/null makes sure nothing can
      # block on a prompt.
      #
      # The unit tests also write the Roborazzi screenshots, because the test
      # task carries roborazzi.test.record = true. See app/build.gradle.kts.
      - name: Build, test and lint
        timeout-minutes: 30
        run: |
          ./gradlew \
            assembleViwoodsDebug assembleGenericDebug \
            testViwoodsDebugUnitTest testGenericDebugUnitTest \
            lintViwoodsDebug lintGenericDebug < /dev/null

      # Gradle prints a stack trace of its own internals, which says nothing
      # about the code. This reads the reports and prints the part that does.
      - name: Show what failed
        if: failure()
        timeout-minutes: 5
        run: |
          echo "===== Failing unit tests ====="
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          found = False
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  bad = list(case.findall("failure")) + list(case.findall("error"))
                  for problem in bad:
                      found = True
                      print(f'{case.get("classname")}.{case.get("name")}')
                      body = (problem.get("message") or "") + "\n" + (problem.text or "")
                      lines = [x for x in body.strip().splitlines() if x.strip()]
                      # The message first, then just enough stack to find it.
                      message = [x for x in lines if not x.strip().startswith("at ")]
                      stack = [x for x in lines if x.strip().startswith("at ")]
                      for line in message[:6] + stack[:3]:
                          print("    " + line)
                      print("-" * 70)
          if not found:
              print("No failing test case was recorded. The failure is somewhere else.")
          PY

          echo
          echo "===== Lint ====="
          shopt -s nullglob
          for report in app/build/reports/lint-results-*.txt; do
            echo "--- $report"
            head -100 "$report"
          done
          echo
          echo "===== Screenshot output ====="
          ls -la app/build/outputs/roborazzi 2>/dev/null || echo "no screenshots were written"

      - name: Upload the debug APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: warn

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/**
          if-no-files-found: warn

      - name: Upload the test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
