name: Release

# Runs when a tag like v0.1.0 is pushed. It builds both flavours, signs them
# with the key held in the repository secrets, and makes a GitHub Release with
# the two APK files. See docs/RELEASING.md for the one-time setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false
  TERM: dumb

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # A release without a key would be an APK nobody can install over the
      # last one. Stop here and say so, rather than publish it.
      - name: Check that the signing key is set up
        env:
          KEYSTORE_BASE64: ${{ secrets.EINK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The secret EINK_RELEASE_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi

      - name: Write the keystore to a file outside the repository
        env:
          KEYSTORE_BASE64: ${{ secrets.EINK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Make the wrapper runnable
        run: chmod +x ./gradlew

      - name: Test, then build the release APKs
        timeout-minutes: 35
        env:
          EINK_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          EINK_RELEASE_STORE_PASSWORD: ${{ secrets.EINK_RELEASE_STORE_PASSWORD }}
          EINK_RELEASE_KEY_ALIAS: ${{ secrets.EINK_RELEASE_KEY_ALIAS }}
          EINK_RELEASE_KEY_PASSWORD: ${{ secrets.EINK_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew \
            testViwoodsDebugUnitTest testGenericDebugUnitTest \
            assembleViwoodsRelease assembleGenericRelease < /dev/null

      - name: Name the files after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/viwoods/release/app-viwoods-release.apk "dist/eink-launcher-${GITHUB_REF_NAME}-viwoods.apk"
          cp app/build/outputs/apk/generic/release/app-generic-release.apk "dist/eink-launcher-${GITHUB_REF_NAME}-generic.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Eink Launcher $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            --verify-tag
