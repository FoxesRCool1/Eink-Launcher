# The test sandbox runs at API 35. The app itself compiles and ships against
# API 37; only the sandbox is pinned.
#
# Why not the newest: at API 36 Robolectric builds an ApplicationSharedMemory,
# which is new in Android 16, and that path reaches into raw FileDescriptor
# internals. On a sealed JDK it fails before any test body runs. API 35 does
# not take that path. Raise this once a Robolectric release handles it, and
# check the screenshots still look right afterwards.
sdk=35

# Roborazzi needs real drawing, not the legacy no-op canvas.
graphicsMode=NATIVE
